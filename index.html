<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alliance Contract Market</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .header-left { flex: 1; }
        .header-right {
            text-align: right;
            min-width: 220px;
        }
        .stats-box {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px 20px;
            display: inline-block;
        }
        .stats-box .stat-row {
            font-size: 1.1rem;
            margin: 4px 0;
        }
        .stats-box .stat-label {
            color: #aaa;
            font-size: 0.85rem;
        }
        .stats-box .stat-value {
            color: #fff;
            font-weight: bold;
        }
        .last-updated {
            color: #888;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        /* Auth */
        #auth-section {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .sso-button-img {
            display: inline-block;
            vertical-align: middle;
            border-radius: 4px;
            transition: transform 0.1s ease, filter 0.2s ease;
            cursor: pointer;
        }
        .sso-button-img:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        /* Logo */
        .logo-container {
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: left;
        }
        .main-logo {
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
        }

        /* Search */
        .search-bar {
            margin-bottom: 12px;
        }
        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            font-size: 1rem;
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            outline: none;
        }
        .search-bar input::placeholder { color: #777; }
        .search-bar input:focus { border-color: #007bff; }

        /* Filter chips */
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .chip {
            padding: 5px 12px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 16px;
            color: #ccc;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            user-select: none;
        }
        .chip:hover {
            background-color: #333;
            border-color: #777;
        }
        .chip.active {
            background-color: #007bff;
            border-color: #007bff;
            color: #fff;
        }

        /* Sort controls */
        .sort-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .sort-btn {
            padding: 8px 14px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background-color 0.15s;
        }
        .sort-btn:hover { background-color: #444; }
        .sort-btn.active {
            background-color: #007bff;
            border-color: #007bff;
        }
        .sort-indicator {
            margin-left: 6px;
            font-size: 0.75rem;
        }

        /* Card grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            transition: border-color 0.2s, transform 0.15s;
        }
        .card:hover {
            border-color: #007bff;
            transform: translateY(-2px);
        }
        .card-image {
            width: 128px;
            height: 128px;
            object-fit: contain;
            border-radius: 6px;
            background-color: #1a1a1a;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: block;
            margin: 0 auto 12px auto;
        }
        .card-image:hover {
            transform: scale(1.03);
            filter: brightness(1.15);
        }
        .card-image-wrapper {
            position: relative;
            display: inline-block;
        }
        .tech-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: 2;
            pointer-events: none;
        }
        .badge-t2 {
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #1a1a1a;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #b8860b;
            line-height: 1;
        }
        .badge-faction {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #00cc00;
            filter: drop-shadow(0 0 2px rgba(0, 200, 0, 0.7));
        }
        .badge-pirate {
            background: #cc0000;
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 3px;
            border: 1px solid #ff4444;
        }
        .badge-t3 {
            background: linear-gradient(135deg, #800080, #da70d6);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 3px;
            border: 1px solid #800080;
        }
        .card-name {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-details {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
        .card-price {
            color: #ffd700;
            font-weight: bold;
        }
        .card-count {
            background-color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        /* Error / loading */
        .status-message {
            text-align: center;
            color: #ff4444;
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="logo-container">
                <img src="img/logo.png" class="main-logo" alt="Alliance Logo">
            </div>
            <div id="auth-section">
                <img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-small.png"
                     class="sso-button-img"
                     alt="Log in with EVE Online"
                     onclick="startPkceLogin()">
            </div>
        </div>
        <div class="header-right">
            <div class="stats-box">
                <div class="stat-row">
                    <span class="stat-label">Total ISK on Market</span><br>
                    <span class="stat-value" id="total-isk">0 ISK</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Total Ships</span><br>
                    <span class="stat-value" id="total-ships">0</span>
                </div>
            </div>
            <div class="last-updated" id="last-updated"></div>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search fits..." oninput="handleSearch(this.value)">
    </div>

    <div class="filter-chips" id="filter-chips"></div>

    <div class="sort-bar">
        <button class="sort-btn" id="sort-title" onclick="sortBy('title')">
            Name<span class="sort-indicator" id="ind-title"></span>
        </button>
        <button class="sort-btn" id="sort-min_price" onclick="sortBy('min_price')">
            Price<span class="sort-indicator" id="ind-min_price"></span>
        </button>
    </div>

    <div class="card-grid" id="contract-grid">
        <!-- Cards injected here -->
    </div>

    <script>
        // --- CONFIGURATION ---
        const clientId = 'ee7a29969a1547d28da9cb148b79c3e7';
        const redirectUri = 'https://emabe390.github.io/SlideContracting/';
        const scope = 'esi-ui.open_window.v1';

        // --- URL PARSING ---
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code');
        const userToken = urlParams.get('token');

        // --- STATE ---
        let contractData = [];
        let visibleData = [];
        let currentSort = { column: 'title', direction: 'asc' };
        let activeFilter = 'all';
        let searchQuery = '';

        const CLASS_LABELS = {
            1: 'Frigate', 2: 'Destroyer', 3: 'Cruiser', 4: 'Battlecruiser',
            5: 'Battleship', 6: 'Capital', 7: 'Industrial', 99: 'Unknown'
        };

        // --- AUTH UI ---
        if (userToken && userToken !== 'None') {
            document.getElementById('auth-section').innerHTML =
                "<span style='color: #00ff00; font-weight: bold;'>Logged In! You can now open contracts.</span>";
        }

        // --- PKCE ---
        function generateRandomString(length) {
            const validChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            let array = new Uint8Array(length);
            window.crypto.getRandomValues(array);
            return Array.from(array, x => validChars[x % validChars.length]).join('');
        }

        async function generateCodeChallenge(verifier) {
            const data = new TextEncoder().encode(verifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function startPkceLogin() {
            const verifier = generateRandomString(64);
            localStorage.setItem('pkce_verifier', verifier);
            const challenge = await generateCodeChallenge(verifier);
            const state = generateRandomString(16);
            const loginUrl = `https://login.eveonline.com/v2/oauth/authorize?response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&client_id=${clientId}&scope=${scope}&code_challenge=${challenge}&code_challenge_method=S256&state=${state}`;
            window.location.href = loginUrl;
        }

        if (authCode) {
            const verifier = localStorage.getItem('pkce_verifier');
            fetch('https://login.eveonline.com/v2/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'authorization_code',
                    client_id: clientId,
                    code: authCode,
                    code_verifier: verifier
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.access_token) {
                    window.location.replace(`${redirectUri}?token=${data.access_token}`);
                } else {
                    alert('Authentication failed.');
                }
            })
            .catch(err => console.error('Token exchange failed:', err));
        }

        // --- DATA FETCH ---
        fetch('contracts.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                return response.text();
            })
            .then(text => {
                if (!text || text.trim() === '') throw new Error('contracts.json is completely empty!');
                const payload = JSON.parse(text);

                // Backward compat: accept both new object schema and old array schema
                if (Array.isArray(payload)) {
                    contractData = payload;
                } else {
                    contractData = payload.contracts || [];
                    if (payload.updated_at) {
                        document.getElementById('last-updated').textContent =
                            'Synced ' + timeAgo(payload.updated_at);
                    }
                }

                buildFilterChips();
                sortBy('title');
            })
            .catch(err => {
                console.error('Data Load Error:', err);
                document.getElementById('contract-grid').innerHTML =
                    `<div class="status-message"><b>Waiting for backend to sync data... (${err.message})</b></div>`;
            });

        // --- FORMATTERS ---
        function fmtIsk(n) {
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B ISK';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M ISK';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K ISK';
            return n.toLocaleString() + ' ISK';
        }

        function timeAgo(isoString) {
            const then = new Date(isoString);
            const now = new Date();
            const diffSec = Math.floor((now - then) / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHr = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHr / 24);

            if (diffSec < 60) return 'just now';
            if (diffMin < 60) return `${diffMin} minute${diffMin !== 1 ? 's' : ''} ago`;
            if (diffHr < 24) return `${diffHr} hour${diffHr !== 1 ? 's' : ''} ago`;
            return `${diffDay} day${diffDay !== 1 ? 's' : ''} ago`;
        }

        // --- FILTER CHIPS ---
        function buildFilterChips() {
            const container = document.getElementById('filter-chips');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'chip active';
            allBtn.textContent = 'All';
            allBtn.dataset.weight = 'all';
            allBtn.onclick = () => setFilter('all');
            container.appendChild(allBtn);

            const weights = [...new Set(contractData.map(c => c.class_weight))].sort((a, b) => a - b);
            for (const w of weights) {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.textContent = CLASS_LABELS[w] || 'Class ' + w;
                btn.dataset.weight = String(w);
                btn.onclick = () => setFilter(w);
                container.appendChild(btn);
            }
        }

        function setFilter(weight) {
            activeFilter = weight;
            document.querySelectorAll('.chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.weight === String(weight));
            });
            applyFiltersAndRender();
        }

        function handleSearch(value) {
            searchQuery = value.trim().toLowerCase();
            applyFiltersAndRender();
        }

        // --- SORT + RENDER PIPELINE ---
        function sortBy(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            applyFiltersAndRender();
        }

        function applyFiltersAndRender() {
            let visible = contractData;

            if (searchQuery) {
                visible = visible.filter(c => c.title.toLowerCase().includes(searchQuery));
            }

            if (activeFilter !== 'all') {
                visible = visible.filter(c => c.class_weight === activeFilter);
            }

            visible.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                }
                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            visibleData = visible;
            renderCards();
        }

        function updateStats() {
            let totalIsk = 0;
            let totalShips = 0;
            for (const row of contractData) {
                totalIsk += row.min_price * row.stock;
                totalShips += row.stock;
            }
            document.getElementById('total-isk').textContent = fmtIsk(totalIsk);
            document.getElementById('total-ships').textContent = totalShips.toLocaleString();
        }

        function renderCards() {
            const grid = document.getElementById('contract-grid');
            grid.innerHTML = '';
            updateStats();

            // Sort button UI
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('sort-' + currentSort.column);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('ind-title').textContent = '';
            document.getElementById('ind-min_price').textContent = '';
            const ind = document.getElementById('ind-' + currentSort.column);
            if (ind) ind.textContent = currentSort.direction === 'asc' ? ' ▲' : ' ▼';

            if (visibleData.length === 0) {
                grid.innerHTML = '<div class="status-message">No contracts match your filters.</div>';
                return;
            }

            visibleData.forEach((row, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                const imgSrc = row.type_id > 0
                    ? `https://images.evetech.net/types/${row.type_id}/render?size=128`
                    : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'card-image-wrapper';

                if (row.tech_level && row.tech_level !== 't1') {
                    const badge = document.createElement('div');
                    badge.className = 'tech-badge badge-' + row.tech_level;
                    if (row.tech_level === 't2') {
                        badge.textContent = 'II';
                    } else if (row.tech_level === 't3') {
                        badge.textContent = 'III';
                    } else if (row.tech_level === 'pirate') {
                        badge.textContent = 'P';
                    }
                    // faction uses CSS triangle (no text content)
                    imgWrapper.appendChild(badge);
                }

                const img = document.createElement('img');
                img.src = imgSrc;
                img.className = 'card-image';
                img.alt = row.title;
                img.onerror = function() {
                    this.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
                    this.onerror = null;
                };
                img.onclick = () => openRandomContract(index);
                imgWrapper.appendChild(img);

                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = row.title;

                const details = document.createElement('div');
                details.className = 'card-details';
                details.innerHTML = `
                    <span class="card-price">${fmtIsk(row.min_price)}</span>
                    <span class="card-count">${row.stock} ship${row.stock !== 1 ? 's' : ''}</span>
                `;

                card.appendChild(imgWrapper);
                card.appendChild(name);
                card.appendChild(details);
                grid.appendChild(card);
            });
        }

        // --- OPEN IN-GAME WINDOW ---
        function openRandomContract(index) {
            if (!userToken || userToken === 'None') {
                alert('You must log in first!');
                return;
            }

            const row = visibleData[index];
            const ids = row.cheapest_ids;
            const randomContractId = ids[Math.floor(Math.random() * ids.length)];

            fetch(`https://esi.evetech.net/latest/ui/openwindow/contract/?contract_id=${randomContractId}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${userToken}`,
                    'Accept': 'application/json'
                }
            })
            .then(res => {
                if (res.status !== 204) {
                    return res.json().then(errData => {
                        alert('Failed to open window. ESI Error: ' + (errData.error || res.status));
                    });
                }
            })
            .catch(err => {
                console.error(err);
                alert('Network error trying to ping the EVE API.');
            });
        }
    </script>
</body>
</html>
